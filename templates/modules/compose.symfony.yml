services:
  web:
    volumes:
      - ${MTDOCKER_PATH}/php/php.ini:/usr/local/etc/php/php.ini
      - ${MTDOCKER_PATH}/php/apache.conf:/etc/apache2/sites-available/000-default.conf
    environment:
      - MAILER_DSN_FILE=/run/secrets/mailer_dsn
      - APP_SECRET_FILE=/run/secrets/app_secret
    secrets:
      - mailer_dsn
      - app_secret

secrets:
  mailer_dsn:
    file: ${MTDOCKER_PATH}/secrets/mailer_dsn
  app_secret:
    file: ${MTDOCKER_PATH}/secrets/app_secret
