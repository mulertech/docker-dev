services:
  web:
    depends_on:
      - valhalla
    environment:
      - VALHALLA_URL=${VALHALLA_URL}

  valhalla:
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest
    container_name: ${CONTAINER_NAME_VALHALLA}
    environment:
      - serve_tiles=True
    ports:
      - "${VALHALLA_PORT}:8002"
    volumes:
      # Read-write: the gis-ops entrypoint writes hashes / extracts tiles into
      # /custom_files on startup, so a :ro mount makes the container exit.
      - ${VALHALLA_TILES_PATH}:/custom_files
    networks:
      - mtdocker-network
