services:
  apache:
    build:
      context: ${MTDOCKER_PATH}
      dockerfile: php/Dockerfile
      args:
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
        PHP_IMAGE: ${PHP_IMAGE}
        BUILDKIT_INLINE_CACHE: 1
    container_name: ${CONTAINER_NAME_APACHE}
    ports:
      - "${APACHE_PORT}:80"
    volumes:
      - ${PROJECT_PATH}:/var/www/html
    environment:
      - PHP_CS_FIXER_IGNORE_ENV=1
    networks:
      - mtdocker-network

networks:
  mtdocker-network:
    driver: bridge
