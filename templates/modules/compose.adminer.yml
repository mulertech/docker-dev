services:
  adminer:
    image: adminer:latest
    container_name: ${CONTAINER_NAME_ADMINER}
    ports:
      - "${ADMINER_PORT}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    volumes:
      - ${MTDOCKER_PATH}/adminer/adminer-index.php:/var/www/html/index.php:ro
    depends_on:
      - postgres
    networks:
      - mtdocker-network
