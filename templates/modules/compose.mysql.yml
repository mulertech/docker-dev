services:
  web:
    environment:
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - DATABASE_PATH=/db
      - DATABASE_SCHEME=mysql
      - DATABASE_QUERY=serverVersion=8.0
      - DATABASE_USER=${DB_USER}
      - DATABASE_PASS=${DB_PASSWORD}
    depends_on:
      - mysql

  mysql:
    image: "mysql:8"
    container_name: ${CONTAINER_NAME_MYSQL}
    ports:
      - "${MYSQL_PORT}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
      - ${MTDOCKER_PATH}/db/init-user.sql:/docker-entrypoint-initdb.d/01-init-user.sql
      - ${MTDOCKER_PATH}/sql:/docker-entrypoint-initdb.d/user-sql
    networks:
      - mtdocker-network

volumes:
  mysql-data:
