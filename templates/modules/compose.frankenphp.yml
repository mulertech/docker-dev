services:
  web:
    build:
      context: ${MTDOCKER_PATH}
      dockerfile: php/Dockerfile
      args:
        USER_ID: ${USER_ID}
        GROUP_ID: ${GROUP_ID}
        FRANKENPHP_IMAGE: ${FRANKENPHP_IMAGE}
        INSTALL_WKHTMLTOPDF: ${INSTALL_WKHTMLTOPDF:-0}
        BUILDKIT_INLINE_CACHE: 1
    container_name: ${CONTAINER_NAME_WEB}
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ${PROJECT_PATH}:/app
      - ${MTDOCKER_PATH}/php/Caddyfile:/etc/caddy/Caddyfile
    environment:
      - PHP_CS_FIXER_IGNORE_ENV=1
      - SERVER_NAME=:80
    networks:
      - mtdocker-network

networks:
  mtdocker-network:
    driver: bridge
