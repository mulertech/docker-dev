services:
  apache:
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=${DB_NAME}
      - DATABASE_USER=${DB_USER}
      - DATABASE_PASSWORD_FILE=/run/secrets/db_password
    secrets:
      - db_password
    depends_on:
      - postgres

  postgres:
    image: "postgres:16"
    container_name: ${CONTAINER_NAME_POSTGRES}
    ports:
      - "${POSTGRES_PORT}:5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ${MTDOCKER_PATH}/db/init-user.sql:/docker-entrypoint-initdb.d/01-init-user.sql
      - ${MTDOCKER_PATH}/sql:/docker-entrypoint-initdb.d/user-sql
    networks:
      - mtdocker-network

secrets:
  db_password:
    file: ${MTDOCKER_PATH}/secrets/db_password

volumes:
  postgres-data:
